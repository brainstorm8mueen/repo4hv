---
- name: Configure and deploy TravelMemory web server
  hosts: web
  become: true
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Install base packages
      ansible.builtin.apt: { name: [git, curl, nginx, ufw], update_cache: true }
    - name: Install Node.js 20 repository
      ansible.builtin.shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args: { creates: /etc/apt/sources.list.d/nodesource.list }
    - name: Install Node.js
      ansible.builtin.apt: { name: nodejs, update_cache: true }
    - name: Create service account
      ansible.builtin.user: { name: travelmemory, system: true, create_home: true, shell: /usr/sbin/nologin }
    - name: Clone assignment repository
      ansible.builtin.git: { repo: "{{ repo_url }}", dest: "{{ app_dir }}", version: main, force: true }
    - name: Set application ownership
      ansible.builtin.file: { path: "{{ app_dir }}", owner: travelmemory, group: travelmemory, recurse: true }
    - name: Install backend dependencies
      community.general.npm: { path: "{{ app_dir }}/backend", production: true }
    - name: Write backend environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/backend/.env"
        owner: travelmemory
        group: travelmemory
        mode: '0600'
        content: |
          MONGO_URI=mongodb://{{ mongo_admin_user }}:{{ mongo_admin_password | urlencode }}@{{ hostvars['db']['ansible_host'] }}:27017/{{ mongo_database }}?authSource=admin
          PORT={{ backend_port }}
      no_log: true
    - name: Write frontend environment
      ansible.builtin.copy:
        dest: "{{ app_dir }}/frontend/.env"
        content: "REACT_APP_BACKEND_URL=http://{{ hostvars['web']['ansible_host'] }}:{{ app_port }}/api\n"
    - name: Install frontend dependencies
      community.general.npm: { path: "{{ app_dir }}/frontend" }
    - name: Build React frontend
      ansible.builtin.command: npm run build
      args: { chdir: "{{ app_dir }}/frontend", creates: "{{ app_dir }}/frontend/build/index.html" }
    - name: Install systemd service
      ansible.builtin.template: { src: templates/travelmemory.service.j2, dest: /etc/systemd/system/travelmemory.service }
      notify: Restart TravelMemory
    - name: Configure Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/travelmemory
        content: |
          server {
            listen {{ app_port }} default_server;
            root {{ app_dir }}/frontend/build;
            index index.html;
            location /api/ { proxy_pass http://127.0.0.1:{{ backend_port }}/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
            location / { try_files $uri /index.html; }
          }
      notify: Restart Nginx
    - name: Enable Nginx site
      ansible.builtin.file: { src: /etc/nginx/sites-available/travelmemory, dest: /etc/nginx/sites-enabled/travelmemory, state: link }
      notify: Restart Nginx
    - name: Remove default Nginx site
      ansible.builtin.file: { path: /etc/nginx/sites-enabled/default, state: absent }
      notify: Restart Nginx
    - name: Allow SSH and application port in UFW
      community.general.ufw: { rule: allow, port: "{{ item }}", proto: tcp }
      loop: ['22', '{{ app_port }}']
    - name: Enable UFW
      community.general.ufw: { state: enabled, policy: deny }
    - name: Disable root SSH login
      ansible.builtin.lineinfile: { path: /etc/ssh/sshd_config, regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
      notify: Restart SSH
  handlers:
    - name: Restart TravelMemory
      ansible.builtin.systemd: { name: travelmemory, state: restarted, enabled: true, daemon_reload: true }
    - name: Restart Nginx
      ansible.builtin.service: { name: nginx, state: restarted, enabled: true }
    - name: Restart SSH
      ansible.builtin.service: { name: ssh, state: restarted }
