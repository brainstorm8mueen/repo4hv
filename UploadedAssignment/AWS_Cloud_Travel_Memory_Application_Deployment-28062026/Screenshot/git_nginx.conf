apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8ngreportsrx
  namespace: default
  labels:
    app: k8ngreportsrx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8ngreportsrx
  template:
    metadata:
      labels:
        app: k8ngreportsrx
    spec:
      containers:
        - name: k8ngreportsrx
          image: sandboxmreg2.clubwise.com/ng/reports:PLACEHOLDER_VERSION
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "80"
            - name: HOST
              value: "k8stagengreports.clubwise.com"
      imagePullSecrets:
        - name: sandboxmreg2
---
apiVersion: v1
kind: Service
metadata:
  name: k8ngreportsrx
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: k8ngreportsrx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8ngreportsrx
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: k8stagengreports.clubwise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8ngreportsrx
                port:
                  number: 80
