name: CI/CD Pipeline - Flask to ECR and EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: flask-student-app
      CONTAINER_PORT: 5000
      HOST_PORT: 5000
      PYTHON_VERSION: "3.11"
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Set failed stage - Checkout
        run: echo "FAILED_STAGE=Checkout" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set failed stage - Install
        run: echo "FAILED_STAGE=Install dependencies" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set failed stage - Test
        run: echo "FAILED_STAGE=Test" >> $GITHUB_ENV

      - name: Run PyTest
        run: pytest -v

      - name: Set failed stage - AWS authentication
        run: echo "FAILED_STAGE=AWS authentication" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: |
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Set failed stage - Build
        run: echo "FAILED_STAGE=Build Docker image" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Set failed stage - Push
        run: echo "FAILED_STAGE=Push image to ECR" >> $GITHUB_ENV

      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_URI"

      - name: Set failed stage - Prepare EC2 SSH access
        run: echo "FAILED_STAGE=Prepare EC2 SSH access" >> $GITHUB_ENV

      - name: Get GitHub runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Temporarily allow SSH from GitHub runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.runner_ip }}/32" || true

      - name: Set failed stage - Deploy
        run: echo "FAILED_STAGE=Deploy to EC2" >> $GITHUB_ENV

      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,IMAGE_TAG,IMAGE_URI,APP_NAME,CONTAINER_PORT,HOST_PORT
          script: |
            set -e
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            docker pull "$IMAGE_URI"
            docker stop "$APP_NAME" || true
            docker rm "$APP_NAME" || true
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE_URI"
            sleep 10
            curl -f "http://localhost:$HOST_PORT/health"

      - name: Set failed stage - Notify
        run: echo "FAILED_STAGE=Notify" >> $GITHUB_ENV

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "SUCCESS: Flask CI/CD deployment completed"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            SUCCESS: Flask CI/CD deployment completed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Docker Image Tag: ${{ github.sha }}
            Docker Image URI: ${{ env.IMAGE_URI }}
            EC2 Target: ${{ secrets.EC2_HOST }}
            Application URL: http://${{ secrets.EC2_HOST }}:5000/health
            Pipeline Run: ${{ env.RUN_URL }}

            Deployment verification passed because the /health endpoint returned success on EC2.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "FAILED: Flask CI/CD pipeline failed at ${{ env.FAILED_STAGE }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            FAILED: Flask CI/CD pipeline failed.

            Failed Stage: ${{ env.FAILED_STAGE }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}
            Pipeline Run: ${{ env.RUN_URL }}

            Please open the pipeline run link above and check the logs for the failed stage.

      - name: Revoke temporary SSH access
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_IP/32" || true
          fi
